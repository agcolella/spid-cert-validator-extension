apiVersion: v1
kind: Namespace
metadata:
  name: app-spid-cert-validator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spid-cert-validator-app
  namespace: app-spid-cert-validator
  labels:
    app: spid-cert-validator-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spid-cert-validator-app
  template:
    metadata:
      labels:
        app: spid-cert-validator-app
    spec:
      containers:
        - name: spid-cert-validator-app
          image: ghcr.io/agcolella/spid-cert-validator-extension:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: spid-cert-validator-service
  namespace: app-spid-cert-validator
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: spid-cert-validator-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spid-cert-validator-ingress
  namespace: app-spid-cert-validator
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: spid-validator.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spid-cert-validator-service
                port:
                  number: 80
