name: CI/CD Pipeline - SPID Cert Validator Extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agcolella/spid-cert-validator-extension

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting e Controllo Qualità Codice JS (ex extension-ci.yml)
  # -------------------------------------------------------------
  lint-extension:
    name: Lint Extension Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev dependencies
        run: |
          npm init -y
          npm install --save-dev eslint

      - name: Create basic ESLint config
        run: |
          cat << 'EOF' > .eslintrc.json
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": "latest",
              "sourceType": "module"
            },
            "rules": {
              "no-unused-vars": ["warn"],
              "no-undef": ["warn"]
            }
          }
          EOF

      - name: Run ESLint on extension JS
        run: |
          npx eslint background.js options.js results.js || echo "Lint warnings/errors, da sistemare ma non blocco la build."

  # -------------------------------------------------------------
  # Job 2: Build Docker e Deploy su K3s (Zorin OS Self-Hosted)
  # -------------------------------------------------------------
  build-and-deploy:
    name: Build & Deploy to K3s
    needs: lint-extension
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to K3s Cluster
        run: |
          echo "🚀 Applicazione del manifest per spid-cert-validator-extension..."
          kubectl apply -f k8s/deployment.yaml

          echo "🔄 Esecuzione rollout del deployment..."
          kubectl rollout restart deployment/spid-cert-validator-app -n app-spid-cert-validator

          echo "📊 Stato dei Pod attivi nel namespace app-spid-cert-validator:"
          kubectl get pods -n app-spid-cert-validator -o wide
